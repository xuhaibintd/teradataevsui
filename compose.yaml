services:
  teradataevsui:
    build: .
    ports:
      - "8010:8010"
    environment:
      EVSUI_ENVIRONMENT: production
      WEB_CONCURRENCY: "1"
      EVSUI_CREDENTIAL_KEY: "${EVSUI_CREDENTIAL_KEY:?Set EVSUI_CREDENTIAL_KEY}"
      EVSUI_BOOTSTRAP_ADMIN: "${EVSUI_BOOTSTRAP_ADMIN:-}"
      EVSUI_BOOTSTRAP_PASSWORD: "${EVSUI_BOOTSTRAP_PASSWORD:-}"
      EVSUI_EXTERNAL_API_ENABLED: "${EVSUI_EXTERNAL_API_ENABLED:-false}"
      EVSUI_API_TOKEN: "${EVSUI_API_TOKEN:-}"
      EVSUI_ARTIFACT_CLEANUP_ENABLED: "${EVSUI_ARTIFACT_CLEANUP_ENABLED:-false}"
      EVSUI_ARTIFACT_RETENTION_DAYS: "${EVSUI_ARTIFACT_RETENTION_DAYS:-30}"
      EVSUI_JOB_STALE_SECONDS: "${EVSUI_JOB_STALE_SECONDS:-900}"
      EVS_VECTORSTORE_READY_TIMEOUT_SECONDS: "${EVS_VECTORSTORE_READY_TIMEOUT_SECONDS:-7200}"
      EVS_VECTORSTORE_READY_POLL_SECONDS: "${EVS_VECTORSTORE_READY_POLL_SECONDS:-5}"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./pem_runtime:/app/pem_runtime
    restart: unless-stopped
